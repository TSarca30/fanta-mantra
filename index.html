<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mantra Asta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header><div class="brand">⚽ <span>MANTRA</span> ASTA</div><div class="status"><i></i> Asta live</div></header>
  <main>
    <section class="search-box"><div><p class="eyebrow">RICERCA GIOCATORE</p><label for="search">Chi è stato chiamato?</label></div><input id="search" autocomplete="off" placeholder="Cerca giocatore o squadra..." /><div id="search-result"></div></section>
    <section class="teams"><div class="section-title"><h2>Rose e crediti</h2><span>Budget iniziale: 500</span></div><div id="teams" class="team-grid"></div></section>
    <section class="market"><div class="market-head"><div><p class="eyebrow">LISTA DISPONIBILI</p><h2>Giocatori <span id="available-count" class="count"></span></h2></div><div class="controls"><label class="favorites-toggle"><input id="favorites-only" type="checkbox" /> Solo segnalati</label><select id="sort" aria-label="Ordina giocatori"></select></div></div><div id="role-buttons" class="role-buttons"></div><div id="players" class="player-list"></div></section>
    <section class="market unavailable"><div class="market-head"><div><p class="eyebrow">LISTA INDISPONIBILI</p><h2>Giocatori acquistati</h2></div><span id="unavailable-count" class="muted"></span></div><div id="unavailable" class="player-list"></div></section>
  </main>
  <dialog id="assign-dialog"><form method="dialog" id="assign-form"><button class="close" value="cancel" aria-label="Chiudi">×</button><p class="eyebrow">ASSEGNA GIOCATORE</p><h2 id="modal-name"></h2><p id="modal-info" class="muted"></p><p id="modal-note" class="modal-note"></p><div class="form-grid"><label>Acquirente<select id="buyer"></select></label><label>Crediti pagati<input id="credits" type="number" min="0" required /></label></div><p id="assign-error" class="form-error" aria-live="polite"></p><div class="dialog-actions"><button value="cancel" class="secondary">Annulla</button><button id="confirm" value="default">Conferma acquisto</button></div></form></dialog>
  <template id="player-template"><article class="player"><button class="flag" type="button"></button><div class="role"></div><div class="player-main"><strong class="name"></strong><span class="club"></span></div><div class="badges"></div><div class="metrics"></div><button class="assign"></button></article></template>
  <script src="/app.js" type="module"></script>
</body>
</html>
